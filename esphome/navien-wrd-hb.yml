# Basic Config

packages:
  navien: !include navien-d1-mini.yml

  
switch:
  - platform: gpio
    id: hot_button
    pin: D5
    name: "Navien Enable Hot Button"
    restore_mode: RESTORE_DEFAULT_ON


button:
  - id: !remove rs485_hot_button
  - platform: template
    name: "Hot Button"
    id: hard_wired_hot_btn
    on_press:
    - switch.turn_off: hot_button
    - delay: 1000ms
    - switch.turn_on: hot_button

