# Basic configuration for the LOLIN/WEMOS C3 Mini.
#
# The default board UART pins are GPIO21 (TX) and GPIO20 (RX). Connect them
# only to the logic side of a 3.3 V-compatible RS-485 transceiver. Never
# connect the Navien RS-485 pair or its approximately 13 V supply directly to
# an ESP32-C3 GPIO pin.

substitutions:
  tx_pin: GPIO21
  rx_pin: GPIO20
  platform: esp32
  board: lolin_c3_mini
  friendly_name: Navien
  project_name: Navien.LOLIN-C3-Mini-ESP32
  project_version: "1.0.0"

packages:
  navien: !include navien-base.yml
  transport: !include navien-transport-wifi.yml
  sensors: !include navien-sensors.yml
  #water_heater: !include navien-water-heater.yml

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

dashboard_import:
  package_import_url: github://htumanyan/navien/esphome/navien-esphome-lolin-c3-mini.yml
  import_full_config: false

button:
  - platform: navien
    name: ${friendly_name} Hot Button

light:
  - platform: esp32_rmt_led_strip
    id: lolin_c3_mini_led
    internal: true
    pin: GPIO7
    num_leds: 1
    channel_colors: GRB
    chipset: WS2812
  - platform: status_led
    id: lolin_c3_mini_status_led
    internal: true
    output: lolin_c3_mini_status_output

output:
  - platform: template
    id: lolin_c3_mini_status_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: return state;
          then:
            - light.turn_on:
                id: lolin_c3_mini_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 80%
          else:
            - light.turn_off: lolin_c3_mini_led
